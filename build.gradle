plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'application'
}

application {
    mainClass = 'com.Instagram.Dummy.DummyApplication'  // Update this with your actual main class
}

group = 'com.Instagram'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.12.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.12.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.12.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.4.0'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'
    // Lombok dependency
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    implementation 'org.springframework:spring-webflux:6.1.14'
}

ext {
    lombokVersion = "1.18.36"
    mapstructVersion = "1.3.1.Final"
    springCloudVersion = "2023.0.2"
    springCloudServicesVersion = "3.3.0"
    azureAppInsightsVersion = "3.5.3"
    sourceJdkVersion = JavaVersion.VERSION_17
    targetJdkVersion = JavaVersion.VERSION_17
}

tasks.named('test') {
    useJUnitPlatform()
}


