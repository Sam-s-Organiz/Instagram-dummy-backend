spring:
  application:
    name: Dummy

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Spring Session configuration
  session:
    jdbc:
      initialize-schema: always

  # Kafka connection
  kafka:
    bootstrap-servers: 172.17.0.2:9092

  # Multipart file upload settings
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Caching with Redis
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes

  # Redis connection settings
  redis:
    host: localhost
    port: 6379
    cache:
      serialize-value: jackson  # Assuming this is a custom property; adjust if needed

  # Static resources (for photo uploads)
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

  # Flyway migration settings
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Logging levels
logging:
  level:
    org.hibernate: INFO
    org.springframework: DEBUG
    org.springframework.cache: DEBUG

# Keycloak base URL
keycloak:
  auth-server-url: http://localhost:8080/auth
